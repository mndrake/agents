# Builds standalone chmc executables (no Python needed) on Windows, macOS and
# Linux. Every push and pull request touching chm_compiler/ runs the tests and
# builds; pushing a tag like v1.0.0 also publishes the executables as a
# GitHub release.
name: chmc executables

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["chm_compiler/**", ".github/workflows/chmc-release.yml"]
  pull_request:
    paths: ["chm_compiler/**", ".github/workflows/chmc-release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: chmc-windows-x64
          - os: macos-latest
            name: chmc-macos-arm64
          - os: ubuntu-latest
            name: chmc-linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: chm_compiler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build and smoke-test the executable
        run: |
          python -m pip install pyinstaller
          bash packaging/build.sh "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: chm_compiler/dist/${{ matrix.name }}*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "chmc $GITHUB_REF_NAME" --generate-notes
